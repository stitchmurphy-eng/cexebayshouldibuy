<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEX ↔ eBay Checker</title>
    <style>
        body { font-family: Arial; padding: 10px; background: #f4f4f4; }
        input, select, button, textarea { width: 100%; margin-bottom: 10px; padding: 8px; font-size: 16px; }
        textarea { height: 300px; }
        .reco { font-size: 22px; font-weight: bold; margin-bottom: 10px; }
        .green { color: green; }
        .red { color: red; }
        .black { color: black; }
        a { color: blue; text-decoration: underline; }
    </style>
</head>
<body>
    <h1>CEX ↔ eBay Checker</h1>
    <form method="POST">
        <label>Game Name:</label>
        <input type="text" name="game" required>

        <label>Console:</label>
        <input type="text" name="console" required>

        <label>CEX Price (€):</label>
        <input type="text" name="cex_price" required>

        <label>Marketplace:</label>
        <select name="marketplace">
            <option value="EBAY-IE">EBAY-IE</option>
            <option value="EBAY-DE">EBAY-DE</option>
        </select>

        <input type="checkbox" name="loose" checked> Include Loose
        <input type="checkbox" name="cib" checked> Include CIB
        <input type="checkbox" name="ignore_sealed" checked> Ignore Sealed

        <button type="submit">Check eBay</button>
    </form>

    {% if recommendation %}
        <div class="reco {{ color }}">{{ recommendation }}</div>
    {% endif %}

    {% if output %}
        <h3>Top Listings:</h3>
        <textarea readonly>{{ output }}</textarea>
    {% endif %}
</body>
</html>
