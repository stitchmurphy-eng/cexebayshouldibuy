<!DOCTYPE html>
<html>
<head>
    <title>CEX ↔ eBay Checker</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        textarea { width: 100%; height: 300px; }
        .reco { font-size: 20px; font-weight: bold; margin-bottom: 20px; }
        .green { color: green; }
        .red { color: red; }
        .black { color: black; }
    </style>
</head>
<body>
    <h1>CEX ↔ eBay Checker</h1>
    <form method="POST">
        <label>Game Name:</label><br>
        <input type="text" name="game" required><br><br>

        <label>Console:</label><br>
        <input type="text" name="console" required><br><br>

        <label>CEX Price (€):</label><br>
        <input type="text" name="cex_price" required><br><br>

        <label>Marketplace:</label><br>
        <select name="marketplace">
            <option value="EBAY-IE">EBAY-IE</option>
            <option value="EBAY-DE">EBAY-DE</option>
        </select><br><br>

        <input type="checkbox" name="loose" checked> Include Loose<br>
        <input type="checkbox" name="cib" checked> Include CIB<br>
        <input type="checkbox" name="ignore_sealed" checked> Ignore Sealed<br><br>

        <button type="submit">Check eBay</button>
    </form>

    <h3>Recommendation:</h3>
    <div class="reco {{ color }}">{{ recommendation }}</div>

    <h3>Output:</h3>
    <textarea readonly>{{ output }}</textarea>
</body>
</html>
